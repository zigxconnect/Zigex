name: Deploy

# Two sites on the same VPS:
#   development  dev.zigexconnect.com  ← every push to zigex
#   production   zigexconnect.com      ← a version tag (git push origin v1.0.1)
# "Run workflow" deploys any tag or branch to either site by hand.
# Each GitHub environment (Settings → Environments) holds its own variables:
# NEXT_PUBLIC_SITE_URL, VPS_APP_DIR, APP_NAME, APP_PORT, BACKEND_URL…
on:
  push:
    branches: [zigex]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [development, production]
        default: development
      ref:
        description: "Tag or branch to deploy (e.g. v1.0.1 or zigex)"
        required: true
      skip_dev_check:
        description: "Emergency only: deploy to production without CI and the development site having passed on this commit"
        type: boolean
        default: false

permissions:
  contents: write # to create the GitHub Release
  checks: read # to see CI's result on the commit
  deployments: read # to see the development deploy's result on the commit

jobs:
  target:
    name: Pick the environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to ${{ needs.target.outputs.environment }}
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy per site at a time; a second one waits instead of interrupting.
    concurrency:
      group: deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    # Add required reviewers to the production environment to approve each release.
    environment:
      name: ${{ needs.target.outputs.environment }}
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    env:
      APP_ENV: ${{ needs.target.outputs.environment }}
      NEXT_PUBLIC_APP_ENV: ${{ needs.target.outputs.environment }}
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://api.zigexconnect.com' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_ADMIN_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_APP_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
      NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
      NEXT_PUBLIC_EMAILJS_AI_WAITLIST_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_AI_WAITLIST_TEMPLATE_ID }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      APP_DIR: ${{ vars.VPS_APP_DIR || (needs.target.outputs.environment == 'production' && '/home/zigex/apps/zigex' || '/home/zigex/apps/zigex-dev') }}
      APP_NAME: ${{ vars.APP_NAME || (needs.target.outputs.environment == 'production' && 'zigex' || 'zigex-dev') }}
      APP_PORT: ${{ vars.APP_PORT || (needs.target.outputs.environment == 'production' && '3200' || '3100') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Production only ships a commit that already passed CI and ran on the
      # development site. Pushing a version starts both at the same time as this,
      # so wait for them (up to 25 minutes) instead of failing straight away.
      - name: Require CI and the development site to have passed on this commit
        if: env.APP_ENV == 'production' && inputs.skip_dev_check != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Commit: $sha"
          deadline=$((SECONDS + 1500))
          while :; do
            # CI = the "Type check, build, audit" job of ci.yml.
            ci="$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=Type%20check%2C%20build%2C%20audit" \
                    --jq '[.check_runs[] | (.conclusion // .status)] | first // "missing"')"
            # Development = a successful deploy of this commit to the development environment
            # (an older deploy shows "inactive" once a newer one replaced it; its success still counts).
            dev="missing"
            for id in $(gh api "repos/$REPO/deployments?sha=$sha&environment=development&per_page=5" --jq '.[].id'); do
              state="$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" \
                         --jq 'map(.state) | if index("success") then "success" elif (.[0] // "") == "failure" or (.[0] // "") == "error" then "failure" else "pending" end')"
              dev="$state"; [ "$dev" = success ] && break
            done
            echo "CI: $ci   development site: $dev"
            if [ "$ci" = success ] && [ "$dev" = success ]; then
              echo "CI and the development site passed on this commit."
              exit 0
            fi
            case "$ci" in failure|cancelled|timed_out|action_required)
              echo "::error::CI didn't pass on $sha. Fix it on zigex, then release a new version."; exit 1;; esac
            if [ "$dev" = failure ]; then
              echo "::error::Deploying $sha to the development site failed. Fix it there first."; exit 1
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::Gave up waiting: this commit wasn't built by CI and deployed to development within 25 minutes."
              echo "::error::Push it to zigex (or Run workflow → development with this ref), test it, then deploy again."
              exit 1
            fi
            sleep 30
          done

      - name: Work out the version
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          ref="${{ needs.target.outputs.ref }}"
          if [ "$APP_ENV" = "production" ]; then
            # Production ships tagged versions only, and the tag must match package.json.
            if ! [[ "$ref" =~ ^v[0-9] ]]; then
              echo "::error::Production deploys need a version tag (v1.2.3), not '$ref'."
              exit 1
            fi
            if [[ "${ref#v}" != "$pkg" ]]; then
              echo "::error::Tag $ref doesn't match package.json version $pkg. Use: npm version patch|minor|major"
              exit 1
            fi
            version="$pkg"
          else
            # Development builds: 1.0.1-dev.<short commit>, so /api/health shows exactly what's running.
            version="$pkg-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "NEXT_PUBLIC_APP_VERSION=$version" >> "$GITHUB_ENV"

      # Fail early, with a clear message, when required GitHub variables aren't set.
      - name: Check configuration
        run: |
          missing=0
          for name in NEXT_PUBLIC_SANITY_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set. Add it under Settings → Secrets and variables → Actions → Variables (see docs/setup/deploy.md)."
              missing=1
            fi
          done
          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID NEXT_PUBLIC_VAPID_PUBLIC_KEY; do
            [ -z "${!name}" ] && echo "::warning::Variable $name is not set; the feature that needs it will be off in this build."
          done
          exit $missing

      # Reuse Next.js's build cache between runs (much faster rebuilds).
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'sanity/**', 'next.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # The standalone server needs the static files and public/ copied in,
      # plus the deploy scripts so the VPS can switch and roll back.
      - name: Package
        run: |
          set -euo pipefail
          out=.release
          rm -rf "$out" && mkdir -p "$out"
          cp -R .next/standalone/. "$out/"
          mkdir -p "$out/.next"
          cp -R .next/static "$out/.next/static"
          cp -R public "$out/public"
          cp -R deploy "$out/deploy"
          tar -czf "zigex-${{ steps.version.outputs.version }}.tar.gz" -C "$out" .
          ls -lh "zigex-${{ steps.version.outputs.version }}.tar.gz"

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (ssh-keyscan output saved as a secret): no trust-on-first-use.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload and switch
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          ssh_opts=(-i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR/incoming'"
          echo "Deploying $v to $APP_ENV ($APP_DIR, $APP_NAME on port $APP_PORT)"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=yes \
            "zigex-$v.tar.gz" "$VPS_USER@$VPS_HOST:$APP_DIR/incoming/"
          # Unpack the deploy script from the tarball itself, so the VPS always runs this release's version.
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "set -e; cd '$APP_DIR/incoming'; tar -xzf 'zigex-$v.tar.gz' ./deploy/remote-deploy.sh; \
             APP_DIR='$APP_DIR' APP_NAME='$APP_NAME' APP_PORT='$APP_PORT' bash ./deploy/remote-deploy.sh '$v' '$APP_DIR/incoming/zigex-$v.tar.gz'; \
             rm -rf ./deploy"

      - name: Check the live site
        if: vars.NEXT_PUBLIC_SITE_URL != ''
        run: |
          want="${{ steps.version.outputs.version }}"
          for i in $(seq 1 10); do
            body="$(curl -fsS --max-time 10 "${{ vars.NEXT_PUBLIC_SITE_URL }}/api/health" || true)"
            if [[ "$body" == *"\"version\":\"$want\""* ]]; then echo "$body"; exit 0; fi
            sleep 6
          done
          echo "::error::${{ vars.NEXT_PUBLIC_SITE_URL }}/api/health doesn't report $want (got: ${body:-no answer}). Check Nginx and the domain."
          exit 1

      - name: GitHub Release
        if: needs.target.outputs.environment == 'production' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # Notes = this version's section of CHANGELOG.md, else GitHub's generated notes.
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then
            gh release create "v$v" --title "v$v" --notes-file notes.md --verify-tag || true
          else
            gh release create "v$v" --title "v$v" --generate-notes --verify-tag || true
          fi

      - name: Clean up the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
