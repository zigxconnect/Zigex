# Nginx site for the Zigex student app (example; adjust server_name).
# Install: sudo cp deploy/nginx/zigex.conf /etc/nginx/sites-available/zigex
#          sudo ln -s /etc/nginx/sites-available/zigex /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d zigexconnect.com -d www.zigexconnect.com   (adds the 443 block and certificates)

upstream zigex_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name zigexconnect.com www.zigexconnect.com;

  # Uploads go through the app as base64 JSON (photos, CVs): allow up to ~15 MB.
  client_max_body_size 15m;

  # Large cookies (session + Google sign-in).
  large_client_header_buffers 8 32k;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Build assets have content hashes in their names: cache for a year.
  location /_next/static/ {
    proxy_pass http://zigex_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker must always be fresh, or students keep an old version.
  location = /sw.js {
    proxy_pass http://zigex_app;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
  }

  location / {
    proxy_pass http://zigex_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # The backend can take several seconds; don't cut slow pages off.
    proxy_read_timeout 90s;
  }
}
