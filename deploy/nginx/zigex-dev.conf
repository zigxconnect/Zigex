# Nginx site for the DEVELOPMENT copy of the student app (dev.zigexconnect.com → port 3100).
# Install: sudo cp deploy/nginx/zigex-dev.conf /etc/nginx/sites-available/zigex-dev
#          sudo ln -s /etc/nginx/sites-available/zigex-dev /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d dev.zigexconnect.com
# Optional password (keeps testers in, everyone else out):
#          sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/zigex-dev.htpasswd tester
#          then uncomment the two auth_basic lines below.

upstream zigex_dev_app {
  server 127.0.0.1:3100;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name dev.zigexconnect.com;

  # Never indexed by search engines (the app also sends noindex and a disallow-all robots.txt).
  add_header X-Robots-Tag "noindex, nofollow" always;

  # auth_basic "Zigex development";
  # auth_basic_user_file /etc/nginx/zigex-dev.htpasswd;

  # Uploads go through the app as base64 JSON (photos, CVs): allow up to ~15 MB.
  client_max_body_size 15m;

  # Large cookies (session + Google sign-in).
  large_client_header_buffers 8 32k;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Build assets have content hashes in their names: cache for a year.
  location /_next/static/ {
    proxy_pass http://zigex_dev_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker must always be fresh, or students keep an old version.
  location = /sw.js {
    proxy_pass http://zigex_dev_app;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
  }

  location / {
    proxy_pass http://zigex_dev_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # The backend can take several seconds; don't cut slow pages off.
    proxy_read_timeout 90s;
  }
}
